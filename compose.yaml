services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: eventmatch
      POSTGRES_USER: eventmatch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eventmatch_local}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventmatch -d eventmatch"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
